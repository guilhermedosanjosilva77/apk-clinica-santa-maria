spring.application.name=santamaria

# URL apontando para o nome do serviço no compose: db_santa_maria
spring.datasource.url=jdbc:mysql://db_santa_maria:3306/clinica_santa_maria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_ROOT_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect